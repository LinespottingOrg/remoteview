name: i18n-check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check locale catalogs
        run: node scripts/i18n-check.mjs
